map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location = /api {
        return 308 /api/;
    }

    location = /central {
        return 308 /central/;
    }

    # Central administrativa publicada pelo mesmo TLS, mas isolada por prefixo.
    # O container não precisa mais expor a porta 9765 na interface pública.
    location /central/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /central;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cookie_path / /central/;
        proxy_read_timeout 300s;
        # ── RESOLUÇÃO TARDIA, DE PROPÓSITO ──────────────────────────────────
        #
        # Com nome literal em `proxy_pass`, o nginx resolve o host NA
        # INICIALIZAÇÃO e se recusa a subir se ele não existir ("host not found
        # in upstream"). Como a Central passou a ser opt-in (perfil "central"),
        # ela NÃO existe numa instalação de cliente — e o container web inteiro
        # deixaria de subir por causa de uma rota que aquele cliente nem usa.
        #
        # Com a variável, a resolução acontece por requisição: sem Central, quem
        # abrir /central/ recebe 502; todo o resto do sistema funciona.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $central_upstream http://drac-central:9765;
        # `rewrite` + proxy_pass SEM URI: com variável E uri, o nginx troca a
        # URI INTEIRA pela escrita aqui (todo pedido virava `GET /` no destino),
        # em vez de substituir apenas o prefixo do location.
        rewrite ^/central/(.*)$ /$1 break;
        proxy_pass $central_upstream;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # ── RESOLUÇÃO TARDIA (mesmo motivo do /central/) ────────────────────
        #
        # Com `api` literal, o nginx resolve o host NA INICIALIZAÇÃO e o
        # container web inteiro se recusa a subir se a API estiver fora naquele
        # instante ("host not found in upstream"). Medido em 13/08/2026: quando
        # a GPU da matriz sumiu e derrubou a API, o web entrou em CRASH-LOOP
        # (312 reinícios) por causa disto — a queda de um serviço virou a queda
        # de dois. Com a variável, a resolução é por requisição: API fora = 502
        # só nesta rota, e o resto do sistema sobe normal.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
    }

    # TLS terminates at the host Nginx. Keeping signaling and HLS under the same
    # origin avoids Android cleartext blocks and browser mixed-content errors.
    location /webrtc/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        # Mesmo defeito do /hls/: o Location da sessão WHEP vem absoluto à raiz
        # do MediaMTX. Sem o prefixo, o DELETE de encerramento cai no SPA (405)
        # e a sessão fica ÓRFÃ transmitindo — medido no mestre: 128 DELETEs
        # perdidos num dia, sessões acumulando até saturar a subida.
        proxy_redirect ~^/(cam_.*)$ /webrtc/$1;
        # RESOLUÇÃO TARDIA — mesmo motivo do /api/ acima, e aqui o preço é o
        # VÍDEO. Com `mediamtx` literal o nginx fixa o IP no arranque; quando o
        # container do MediaMTX é RECRIADO (deploy, drac-up.sh, troca de
        # overlay de GPU) ele ganha IP novo e o web passa a apontar para um
        # endereço morto — o ao vivo cai inteiro e só volta reiniciando o web.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mediamtx_webrtc http://mediamtx:8889;
        rewrite ^/webrtc/(.*)$ /$1 break;
        proxy_pass $mediamtx_webrtc;
    }

    location /hls/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        # Segmento de HLS é ~96% do access log (medido: ~4 GB/dia no servidor
        # mestre). Playlist e erros continuam logados.
        access_log off;
        # O MediaMTX manda o 302 de cookieCheck com Location absoluto à raiz
        # DELE (/cam_xxx/...), sem saber que está sob /hls/. Sem reescrever, o
        # navegador segue o redirect para fora e cai no SPA — quebra o
        # fallback HLS do live e o player do mobile.
        proxy_redirect ~^/(cam_.*)$ /hls/$1;
        # RESOLUÇÃO TARDIA — idem. Este é o caminho de HLS, o retorno do live
        # quando o WebRTC não está disponível (e o player do aplicativo).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mediamtx_hls http://mediamtx:8888;
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass $mediamtx_hls;
    }

    location = /dashboard {
        return 302 /live;
    }

    location = /dashboard/ {
        return 302 /live;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        try_files $uri $uri/ /index.html;
    }
}
