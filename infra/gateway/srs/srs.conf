# AjustCam SRS — entrada RTMP pública da primeira instalação.
#
# O NAT entrega uma única porta 1935 para esta Gateway. Enquanto existe apenas
# um tenant RTMP, o SRS preserva app/stream e encaminha para o SRS da IBtelecom,
# onde a chave é validada pela API da própria instalação. Antes do segundo
# tenant, substituir `destination` pelo backend dinâmico do roteador por chave.
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

http_api {
    enabled         on;
    listen          1985;
}

vhost __defaultVhost__ {
    chunk_size      4096;
    tcp_nodelay     on;
    min_latency     on;

    forward {
        enabled     on;
        destination 10.10.0.20:1935;
    }
}
