name: ajustcam-gateway

services:
  nginx:
    # Digest validado na Gateway em 31/08/2026. Evita uma atualização
    # silenciosa do registry alterar a borda pública durante um simples `up`.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: ajustcam-gateway-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - gateway-net

  coturn:
    image: coturn/coturn:latest@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e
    container_name: ajustcam-gateway-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./nginx/ssl:/etc/coturn/ssl:ro
      - ./logs/coturn:/var/log/turnserver
    command: ["-c", "/etc/coturn/turnserver.conf"]

  srs:
    image: ossrs/srs:5@sha256:b429bdb565f0a533e60634856760a500a1b673f8cadce072b2a2eb2674cd7b31
    container_name: ajustcam-gateway-srs
    restart: unless-stopped
    # A imagem inicia `conf/docker.conf` por padrão. Sem indicar o arquivo, o
    # bind mount abaixo existe mas é ignorado e o forward nunca é aplicado.
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    ports:
      - "1935:1935"
      - "127.0.0.1:1985:1985"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
    networks:
      - gateway-net

networks:
  gateway-net:
    name: ajustcam-gateway-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
