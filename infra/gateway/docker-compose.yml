name: ajustcam-gateway

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ajustcam-gateway-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - gateway-net

  coturn:
    image: coturn/coturn:latest
    container_name: ajustcam-gateway-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./nginx/ssl:/etc/coturn/ssl:ro
      - ./logs/coturn:/var/log/turnserver
    command: ["-c", "/etc/coturn/turnserver.conf"]

  srs:
    image: ossrs/srs:5
    container_name: ajustcam-gateway-srs
    restart: unless-stopped
    # A imagem inicia `conf/docker.conf` por padrão. Sem indicar o arquivo, o
    # bind mount abaixo existe mas é ignorado e o forward nunca é aplicado.
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    ports:
      - "1935:1935"
      - "127.0.0.1:1985:1985"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./srs/srs.conf:/usr/local/srs/conf/srs.conf:ro
    networks:
      - gateway-net

networks:
  gateway-net:
    name: ajustcam-gateway-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
