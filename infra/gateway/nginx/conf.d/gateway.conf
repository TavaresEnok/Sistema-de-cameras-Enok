server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor deliberadamente fechado para IPs, Host headers desconhecidos e
# domínios ainda não cadastrados. Cada tenant recebe um server_name explícito.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ajustcam-gateway: ok\n";
    }

    location / {
        return 444;
    }
}

# Compatibilidade com o endpoint historicamente usado pelas instalações para
# alcançar a Central. O domínio próprio da Central continua preferencial.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ajustcam.ajustconsulting.com.br;

    ssl_certificate /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;

    client_max_body_size 512m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 2100s;
    proxy_send_timeout 2100s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ajustcam-gateway: ok\n";
    }

    location /central/ {
        proxy_pass http://10.10.0.11:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        return 404;
    }
}
