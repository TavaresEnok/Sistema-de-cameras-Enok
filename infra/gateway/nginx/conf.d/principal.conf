server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name principal.s2cam.com.br;

    ssl_certificate /etc/letsencrypt/live/s2cam.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s2cam.com.br/privkey.pem;

    client_max_body_size 512m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # A instalação principal antiga força HTTPS. A Gateway conversa com
        # seu TLS diretamente para evitar um ciclo de redirecionamento.
        proxy_pass https://168.194.13.70:443;
        proxy_ssl_server_name on;
        proxy_ssl_name ajustcam.ajustconsulting.com.br;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
