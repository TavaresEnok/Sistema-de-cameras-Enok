server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo-03.s2cam.com.br;

    ssl_certificate /etc/letsencrypt/live/s2cam.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s2cam.com.br/privkey.pem;

    client_max_body_size 512m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # A VM ainda será criada em 10.10.0.22. Assim que a instalação subir,
        # web, API, HLS e WHEP passam por esta única rota sem novo ajuste
        # público na Gateway.
        proxy_pass http://10.10.0.22:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        # Antes do primeiro deploy, 10.10.0.22 ainda não escuta a aplicação.
        # Não exponha um 502 técnico ao visitante; quando a VM ficar pronta o
        # proxy volta a responder normalmente, sem nova alteração na Gateway.
        proxy_intercept_errors on;
        error_page 502 503 504 = @installation_pending;
    }

    location @installation_pending {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "Instalação em preparação. Tente novamente em alguns minutos.\n";
    }
}
