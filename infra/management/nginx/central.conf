server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    client_max_body_size 512m;

    # Somente a Gateway publica a Central. A própria rede Docker é permitida
    # para healthchecks e para a entrega autenticada de APKs.
    allow 10.10.0.10;
    allow 10.10.0.11;
    allow 172.16.0.0/12;
    deny all;

    location = /health {
        proxy_pass http://central:9765/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /apk/ {
        alias /srv/apk/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    # As instalações privadas precisam baixar o instalador aprovado,
    # matricular-se e enviar heartbeat sem depender do DNS público ou do
    # certificado da Gateway. Os dois canais abaixo exigem token/licença na
    # Central; painel, releases e endpoints administrativos seguem restritos.
    location ^~ /install/ {
        allow 10.10.0.0/24;
        allow 172.16.0.0/12;
        deny all;

        proxy_pass http://central:9765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    location ^~ /api/agent/ {
        allow 10.10.0.0/24;
        allow 172.16.0.0/12;
        deny all;

        proxy_pass http://central:9765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        proxy_pass http://central:9765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 2100s;
        proxy_send_timeout 2100s;
    }
}
