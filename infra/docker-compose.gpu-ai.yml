# Override de GPU para o SERVIÇO DE IA (rostos/objetos em CUDA) — OPT-IN, PESADO.
#
# Separado do docker-compose.gpu.yml de propósito: aquele (transcode/NVENC) é
# leve e pode entrar no COMPOSE_FILE padrão do host; ESTE constrói a imagem CUDA
# do ai-service (base nvidia/cuda, vários GB) e por isso NÃO deve subir sozinho
# num `docker compose up`. Some-o à mão só quando for ativar a IA por GPU:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.gpu.yml -f docker-compose.gpu-ai.yml up -d --build ai-service
#
# Ver infra/AI-GPU-README.md. Hoje o caminho de OBJETOS em CUDA ainda é a
# reimplementação pendente; rostos já caem para CUDA com FACE_RUNTIME.

services:
  ai-service:
    # RESERVA FORMAL do dispositivo, além do env. Toolkits novos (v1.17+, era
    # do driver 610) recusam GPU concedida só por NVIDIA_VISIBLE_DEVICES em
    # contêiner não-privilegiado — o runtime troca o valor por 'void' na
    # criação, silenciosamente, e `docker inspect` segue mostrando 'all'.
    # A reserva via device request não depende dessa política.
    gpus: all
    build:
      context: ../services/ai-service-python
      dockerfile: Dockerfile.gpu
    image: drac-ai-service-gpu:local
    # Sem reserva RÍGIDA de device (ver comentário no docker-compose.gpu.yml): a
    # GPU vem pelo RUNTIME nvidia + NVIDIA_VISIBLE_DEVICES, e o ObjectDetector
    # confere o device node em runtime (`_gpu_realmente_presente`) antes de pedir
    # CUDA — sem placa ele cai para CPU em vez de estourar (SEGFAULT do
    # onnxruntime pedindo CUDA sem device).
    #
    # `runtime: nvidia` EXPLÍCITO desde o incidente de 11/08/2026: o
    # `default-runtime: nvidia` saiu do daemon (fazia TODO container morrer
    # quando a placa sumia). Sem esta linha o container sobe, mas SEM enxergar a
    # GPU — e a IA cai em CPU de forma silenciosa. Foi o que aconteceu logo após
    # restaurar o serviço: providers viraram ['Azure','CPU'], sem CUDA.
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      # Driver novo (610.x, RTX 50xx) fica FORA das faixas do NVIDIA_REQUIRE_CUDA
      # da imagem CUDA 12.4 (escritas quando driver<536 era o mais novo). Com a
      # exigência insatisfeita o runtime da NVIDIA neutraliza a placa trocando
      # NVIDIA_VISIBLE_DEVICES para 'void' NA CRIAÇÃO — o processo nasce sem GPU
      # enquanto `docker inspect` mostra 'all'. Diagnóstico de 14/08/2026, uma
      # noite inteira: o portão de CUDA do detector via 'void' e caía para CPU.
      # Esta é a válvula OFICIAL para pular a checagem de versão.
      - NVIDIA_DISABLE_REQUIRE=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # IA por GPU LIGADA e verificada (paridade de detecção com OpenVINO
      # confirmada, 4,3 ms/frame na RTX 5060 Ti). Ambos caem para CPU sozinhos
      # se o provider/kernel CUDA faltar — a câmera nunca fica cega.
      - GENERAL_RUNTIME=onnxruntime_cuda   # objetos: YOLO26n via ONNX Runtime CUDA (yolo26n.onnx)
      - FACE_RUNTIME=onnxruntime_cuda      # rostos: insightface cai para CUDA automaticamente
