# Override de GPU para o SERVIÇO DE IA (rostos/objetos em CUDA) — OPT-IN, PESADO.
#
# Separado do docker-compose.gpu.yml de propósito: aquele (transcode/NVENC) é
# leve e pode entrar no COMPOSE_FILE padrão do host; ESTE constrói a imagem CUDA
# do ai-service (base nvidia/cuda, vários GB) e por isso NÃO deve subir sozinho
# num `docker compose up`. Some-o à mão só quando for ativar a IA por GPU:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.gpu.yml -f docker-compose.gpu-ai.yml up -d --build ai-service
#
# Ver infra/AI-GPU-README.md. Hoje o caminho de OBJETOS em CUDA ainda é a
# reimplementação pendente; rostos já caem para CUDA com FACE_RUNTIME.

services:
  ai-service:
    build:
      context: ../services/ai-service-python
      dockerfile: Dockerfile.gpu
    image: drac-ai-service-gpu:local
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # IA por GPU LIGADA e verificada (paridade de detecção com OpenVINO
      # confirmada, 4,3 ms/frame na RTX 5060 Ti). Ambos caem para CPU sozinhos
      # se o provider/kernel CUDA faltar — a câmera nunca fica cega.
      - GENERAL_RUNTIME=onnxruntime_cuda   # objetos: YOLO26n via ONNX Runtime CUDA (yolo26n.onnx)
      - FACE_RUNTIME=onnxruntime_cuda      # rostos: insightface cai para CUDA automaticamente
