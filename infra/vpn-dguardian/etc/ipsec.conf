config setup
    charondebug="ike 1, knl 1, cfg 0"

conn dguardian
    keyexchange=ikev1
    authby=secret
    type=transport
    # Encapsula ESP em UDP/4500 mesmo sem NAT detectado. Isso evita que
    # firewalls ou operadoras tratem o protocolo ESP nativo de forma instavel.
    forceencaps=yes
    left=%defaultroute
    leftprotoport=17/1701
    right=hf2099ybvj0.sn.mynetname.net
    rightid=%any
    rightprotoport=17/1701
    # DETECTAR QUE O PARCEIRO SUMIU, E RECONSTRUIR.
    # Medido em 12/08: o MikroTik do cliente apaga a chave IPsec aos 2min25s
    # e NAO estabelece outra. Nosso lado achava que a chave valia 3 horas
    # (maximum IKE_SA lifetime 10643s), continuava usando chave morta, e o
    # tunel caia sem ninguem perceber — 40s de "de pe mas nao passa".
    # Com DPD nos percebemos em ate 60s e refazemos sozinhos.
    dpdaction=restart
    dpddelay=10s
    dpdtimeout=60s
    # Se o parceiro encerrar de forma limpa, tambem refaz.
    closeaction=restart
    keyingtries=%forever
    auto=add
    # O MikroTik aceita combinações diferentes conforme a versão do RouterOS;
    # oferecemos as usuais em vez de cravar uma e falhar por detalhe.
    ike=aes128-sha1-modp1024,aes128-sha1-modp2048,aes256-sha1-modp1024,aes256-sha1-modp2048,aes256-sha256-modp2048,aes128-sha256-modp2048,3des-sha1-modp1024
    esp=aes128-sha1,aes256-sha1,aes128-sha256,aes256-sha256,3des-sha1
