[global]
access control = no

[lac dguardian]
redial = yes
redial timeout = 10
; CUIDADO: "max redials = 0" e' INVALIDO no xl2tpd e derruba o servico inteiro
; na largada (pago em 12/08 para descobrir). 5 rediscagens; depois delas o
; vigia (timer de 3 min) assume o resgate.
max redials = 5
lns = hf2099ybvj0.sn.mynetname.net
ppp debug = no
pppoptfile = /etc/ppp/options.l2tpd.client
length bit = yes
