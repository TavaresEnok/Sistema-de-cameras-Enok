# Override de GPU NVIDIA — preparação ÚNICA para habilitar a aceleração por placa.
#
# Pré-requisitos no HOST (fora deste arquivo):
#   1. Driver NVIDIA instalado e funcionando (`nvidia-smi` responde no host).
#   2. NVIDIA Container Toolkit instalado
#      (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/).
#
# Forma recomendada (faz tudo sozinho): ./gpu-setup.sh
#
# Ou manualmente (somando aos compose existentes):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.gpu.yml up -d --build
#
# Depois de subir: em Configurações → GPU / Aceleração, rode o auto-teste e clique
# em "Ativar". O transcode passa de libx264 (CPU) para h264_nvenc (GPU).
#
# O ffmpeg com NVENC já vem embutido (mediamtx-nvenc.Dockerfile construído acima).
# A API usa o mesmo ffmpeg do host-image para auto-teste/métricas via nvidia-smi.

# RESILIÊNCIA A PLACA ARRANCADA: aqui NÃO se usa
# `deploy.resources.reservations.devices` (reserva RÍGIDA de GPU). Aquilo faz o
# container SE RECUSAR A SUBIR quando não há placa — então, se alguém arranca a
# GPU e o stack reinicia, o sistema inteiro não voltava. Em vez disso, a GPU é
# exposta pelo RUNTIME nvidia (default do daemon) + NVIDIA_VISIBLE_DEVICES: com
# placa, o runtime injeta a GPU; SEM placa, ele só avisa e o container sobe
# mesmo assim, e o código cai para CPU (transcode→libx264, IA→CPU). Medido:
# arrancar a placa não derruba mais o boot.
services:
  api:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      # Sinaliza à API que o pipeline de transcode (MediaMTX) tem NVENC embutido.
      # A checagem final ainda confere o device node em runtime, então placa
      # arrancada faz o transcode cair para libx264 sozinho.
      - GPU_TRANSCODE_AVAILABLE=true

  mediamtx:
    # Onde o transcode de vídeo realmente acontece. Imagem com ffmpeg NVENC.
    build:
      context: .
      dockerfile: mediamtx-nvenc.Dockerfile
    image: drac-mediamtx-nvenc:local
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility

  # A aceleração de IA por GPU (ai-service em imagem CUDA) foi MOVIDA para
  # docker-compose.gpu-ai.yml — é opt-in e PESADA (build de vários GB), então
  # não pode entrar no COMPOSE_FILE padrão do host, senão um `docker compose up`
  # comum tentaria construí-la. Este arquivo agora só acelera o TRANSCODE
  # (MediaMTX NVENC + API), que é leve e seguro de ser sempre incluído.
