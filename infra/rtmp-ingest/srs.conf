# ── TRADUTOR DE DIALETO RTMP (SRS) ──────────────────────────────────────────
#
# Por que existe, medido em campo (2026-08-01, Positivo CIP-B1312-M):
# a câmera fala o dialeto RTMP legado da Adobe/FMLE — releaseStream →
# FCPublish → createStream → publish — e EXIGE a resposta `onFCPublish` antes
# de soltar o primeiro quadro. O MediaMTX 1.18.2 não envia esse comando (a
# string sequer existe no binário), então a câmera conecta, é aceita, espera
# a resposta que nunca vem e desliga em ~150 ms, sem enviar vídeo.
#
# O SRS responde `onFCPublish` e repassa o fluxo ao MediaMTX pela rede interna.
#
# ── SEGURANÇA — LEIA ANTES DE MEXER ─────────────────────────────────────────
#
# Este container só existe para TRADUZIR protocolo. A autorização de quem pode
# publicar continua no MediaMTX → mediamtx-auth do DRAC. Mas o SRS tem um
# comportamento PADRÃO PERIGOSO que precisa ser desligado explicitamente:
#
#  ⚠ Por padrão o SRS SERVE qualquer stream publicado para RTMP PLAY anônimo.
#    Sem o bloco `security { deny play all }` abaixo, qualquer um que alcance a
#    porta pública e adivinhe o path (live/liveStream_<serial>, e o serial é
#    IMPRESSO na câmera) assistiria ao vivo SEM streamToken, contornando a ACL
#    e a LGPD. Isso foi pego numa revisão adversarial antes de ir a produção.
#    NUNCA remova o `deny play all`.
#
# Além disso: API administrativa, servidor HTTP, HLS e DVR do SRS todos
# DESLIGADOS. Só o exporter de métricas fica ativo numa porta publicada
# exclusivamente em loopback pelo Compose.
listen              1935;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;
# read_only no container: o pid vai para o tmpfs montado em /tmp.
pid                 /tmp/srs.pid;

# Sem nenhuma superfície de rede além do RTMP de entrada.
http_api {
    enabled         off;
}
http_server {
    enabled         off;
}
stats {
    network         0;
}

# Saúde e capacidade do tradutor (conexões, tráfego e erros). Não contém vídeo
# e não é publicado na internet; o bind externo é 127.0.0.1.
exporter {
    enabled         on;
    listen          9972;
    label           drac;
    tag             rtmp-ingest;
}

vhost __defaultVhost__ {
    # Evita agregação e latência desnecessárias na publicação de firmwares
    # embarcados. Isso não substitui codec/fonte configurados corretamente na
    # câmera, mas reduz a janela entre os comandos FMLE e as respostas do SRS.
    tcp_nodelay     on;
    min_latency     on;
    publish {
        mr          off;
    }

    # Aprende a tentativa no instante do comando `publish`, antes do primeiro
    # quadro. Câmeras FMLE defeituosas podem desligar logo após o aceite; esperar
    # o MediaMTX nesse caso deixa a lista de pendentes vazia. O callback só
    # autoriza no primeiro salto: caminho conhecido recebe code=0; desconhecido
    # é registrado como pendente e recebe code!=0, sem consumir um forward.
    http_hooks {
        enabled     on;
        on_publish  http://rtmp-callback:8080/on-publish;
    }

    # ── A TRAVA CRÍTICA ─────────────────────────────────────────────────────
    # Publicar sim (é para isso que o tradutor existe); LER (play) na borda do
    # SRS, JAMAIS. Quem assiste é o MediaMTX via WebRTC/HLS, atrás do
    # streamToken. Sem esta trava, a porta pública vazaria o acervo ao vivo.
    security {
        enabled     on;
        allow       publish all;
        deny        play all;
    }

    # Repassa CADA publicação ao MediaMTX interno, preservando o nome do fluxo
    # (é ele que o DRAC vincula à câmera). O MediaMTX então chama a nossa
    # autorização — a fronteira de acesso segue lá, não aqui.
    forward {
        enabled     on;
        destination mediamtx:1935;
    }

    # Sem transcode, sem HLS local, sem DVR: repasse puro, nada persistido.
    hls {
        enabled     off;
    }
    dvr {
        enabled     off;
    }
}
